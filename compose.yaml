services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: times
      POSTGRES_PASSWORD: times
      POSTGRES_DB: times
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - times-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U times -d times"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  times-postgres:
